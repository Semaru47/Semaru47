<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="DeadCommunity banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="45%" stop-color="#12183a"/>
      <stop offset="100%" stop-color="#0a2a2a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8b7cff"/>
      <stop offset="50%" stop-color="#5eead4"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8b7cff" stop-opacity=".35"/>
      <stop offset="100%" stop-color="#5eead4" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="18"/></filter>
  </defs>
  <rect width="1200" height="320" fill="url(#bg)"/>
  <circle cx="180" cy="60" r="120" fill="url(#glow)" filter="url(#soft)"/>
  <circle cx="980" cy="260" r="140" fill="#5eead4" opacity=".12" filter="url(#soft)"/>
  <circle cx="720" cy="40" r="90" fill="#38bdf8" opacity=".12" filter="url(#soft)"/>
  <!-- network mark -->
  <g transform="translate(70 95)">
    <path d="M14 18 36 5l22 13v26L36 57 14 44Z" fill="none" stroke="url(#accent)" stroke-width="4"/>
    <circle cx="14" cy="18" r="5" fill="#8b7cff"/>
    <circle cx="36" cy="5" r="5" fill="#a99fff"/>
    <circle cx="58" cy="18" r="5" fill="#70d9d0"/>
    <circle cx="58" cy="44" r="5" fill="#5eead4"/>
    <circle cx="36" cy="57" r="5" fill="#6ce3d6"/>
    <circle cx="14" cy="44" r="5" fill="#7d8df5"/>
    <rect x="27" y="27" width="18" height="18" rx="5" fill="url(#accent)"/>
    <path d="m31.5 36 3 3 6-7" fill="none" stroke="#070912" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="170" y="145" fill="#f8fafc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="54" font-weight="800" letter-spacing="-1.8">dead</text>
  <text x="295" y="145" fill="url(#accent)" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="54" font-weight="800" letter-spacing="-1.8">community</text>
  <text x="170" y="190" fill="#94a3b8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="500">Live platforms · Discord bots · Self-hosted tools</text>
  <rect x="170" y="220" width="220" height="8" rx="4" fill="url(#accent)"/>
  <text x="170" y="270" fill="#cbd5e1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18">Built and operated end-to-end — not just designed on paper.</text>
</svg>