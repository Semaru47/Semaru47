<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="DeadCommunity">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="100%" stop-color="#12183a"/>
    </linearGradient>
    <linearGradient id="d" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8b7cff"/>
      <stop offset="55%" stop-color="#5eead4"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="10" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <g transform="translate(96 80)" filter="url(#glow)">
    <!-- rounded C arc + bar = D, thick stroke style -->
    <path d="M220 40
             C 40 40, 40 312, 220 312
             " fill="none" stroke="url(#d)" stroke-width="72" stroke-linecap="round"/>
    <rect x="250" y="40" width="72" height="272" rx="36" fill="url(#d)"/>
  </g>
</svg>